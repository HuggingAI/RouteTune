[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "routetune-core"
version = "0.1.0"
description = "Evidence-driven model routing under a quality constraint"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "HuggingAI" }]
keywords = ["llm", "model-routing", "openai-compatible", "llmops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "fastapi>=0.115",
  "joblib>=1.4",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/HuggingAI/RouteTune"
Repository = "https://github.com/HuggingAI/RouteTune"
Issues = "https://github.com/HuggingAI/RouteTune/issues"

[project.optional-dependencies]
benchmark = [
  "pyarrow>=18",
]
nlp = [
  "spacy>=3.8",
]

[project.scripts]
routetune = "routetune_core.cli:main"

[dependency-groups]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/routetune_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
