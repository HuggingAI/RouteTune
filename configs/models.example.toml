# RouteTune never stores API keys here. Set only the environment-variable name.
# Lower cost_rank means the model is cheaper. Exact provider prices are deliberately omitted.

[providers.openrouter]
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
headers = { "HTTP-Referer" = "https://github.com/HuggingAI/RouteTune", "X-Title" = "RouteTune" }

[providers.siliconflow]
base_url = "https://api.siliconflow.cn/v1"
api_key_env = "SILICONFLOW_API_KEY"

[providers.minimax]
base_url = "https://api.minimaxi.com/v1"
base_url_env = "MINIMAX_BASE_URL"
api_key_env = "MINIMAX_API_KEY"

# Copy this file to an ignored local file, then replace these examples with fixed,
# currently available model slugs. Do not use OpenRouter's random `openrouter/free`
# router: RouteTune needs a stable candidate identity.

[models."candidate-a"]
provider = "openrouter"
api_model = "replace-with-a-fixed-model-slug:free"
cost_rank = 1
max_tokens = 1024
route_label = "tier_1"
tags = ["free", "general"]

[models."candidate-b"]
provider = "siliconflow"
api_model = "replace-with-a-current-model-slug"
cost_rank = 2
max_tokens = 1024
route_label = "tier_2"
tags = ["general"]

# Keep at least one enabled model on the cold-start fallback layer (tier_5).
[models."candidate-strong"]
provider = "openrouter"
api_model = "replace-with-a-fixed-strong-model-slug"
cost_rank = 3
max_tokens = 2048
route_label = "tier_5"
tags = ["general", "fallback"]

# For a MiniMax candidate, add another model table and assign its relative order only.
# RouteTune's current question is whether lower-ranked models can safely handle requests,
# not the provider-specific dollar amount. `max_requests` protects API/hourly quotas.
# Provider-specific options such as `thinking`, `reasoning_split`, and
# `max_tokens_field = "max_completion_tokens"` should only be set when that API requires them.
