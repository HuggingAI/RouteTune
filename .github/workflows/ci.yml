name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          version: latest-known
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest
      - run: docker build -t routetune:ci .
