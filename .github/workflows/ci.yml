name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
          version: "0.6.6"
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv export --frozen --no-dev --no-emit-project --output-file requirements.lock
      - run: git diff --exit-code -- requirements.lock
      - run: uv run ruff check .
      - run: uv run pytest
      - run: docker build -t routetune:ci .
