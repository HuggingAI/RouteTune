name: Feature request
description: 提议直接改善真实路由闭环的能力
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        RouteTune 不以通用 Gateway、综合评测平台或大而全 LLMOps 为目标。请先说明真实场景，再描述功能形态。
  - type: textarea
    id: scenario
    attributes:
      label: 真实场景与问题
      description: 谁在什么流程中遇到了什么问题？现有方式为什么不足？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 可验证的成功标准
      description: 实现后如何判断它确实改善了路由质量、可靠性、安全性或维护成本？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可包含替代方案、数据契约、兼容性或安全影响。
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 边界确认
      options:
        - label: 我已阅读 ROADMAP.md，并确认建议服务于 RouteTune 的核心闭环。
          required: true
        - label: 内容不包含密钥、客户数据或其他敏感信息。
          required: true
